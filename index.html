<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abel Conservation LLC</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  background: #f5f3ef;
  color: #1a1714;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}

.container {
  max-width: 680px;
  width: 100%;
  text-align: center;
}

.logo-wrap {
  margin-bottom: 36px;
}

.logo-wrap img {
  max-width: 380px;
  width: 90%;
  height: auto;
}

.divider {
  width: 60px;
  height: 2px;
  background: #2d5932;
  margin: 32px auto;
}

.tagline {
  font-size: 18px;
  color: #4a5550;
  line-height: 1.7;
  max-width: 520px;
  margin: 0 auto 40px;
}

.nav-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 14px;
  margin-top: 8px;
}

.nav-link {
  display: inline-block;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #2d5932;
  border: 1.5px solid #2d5932;
  border-radius: 5px;
  padding: 10px 22px;
  transition: background 0.16s, color 0.16s;
  font-weight: 500;
}

.nav-link:hover {
  background: #2d5932;
  color: #fff;
}

footer {
  margin-top: 64px;
  font-size: 12px;
  color: #9a9490;
  letter-spacing: 0.04em;
}

@media (max-width: 480px) {
  .logo-wrap img { max-width: 280px; }
  .tagline { font-size: 16px; }
}
</style>
</head>
